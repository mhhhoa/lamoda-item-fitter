name: Тесты и сборка exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки для Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Прогон тестов
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows:
    name: Сборка exe
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Сборка
        run: pyinstaller --noconfirm --clean LamodaItemFitter.spec
      - name: Самопроверка собранного exe
        shell: pwsh
        run: |
          # exe собран без консоли и отпускает командную строку сразу,
          # поэтому ждём процесс явно и читаем его отчёт
          $process = Start-Process -FilePath dist\LamodaItemFitter.exe `
            -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($process.ExitCode -ne 0) {
            Write-Error "самопроверка не прошла (код $($process.ExitCode))"
            exit 1
          }
      - name: Размер сборки
        shell: pwsh
        run: |
          $size = (Get-Item dist\LamodaItemFitter.exe).Length / 1MB
          Write-Host ("LamodaItemFitter.exe — {0:N1} МБ" -f $size)
      - uses: actions/upload-artifact@v4
        with:
          name: LamodaItemFitter-windows
          path: dist/LamodaItemFitter.exe
          if-no-files-found: error
      - name: Черновик релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/LamodaItemFitter.exe
          body: |
            Готовый `LamodaItemFitter.exe` для Windows.
            Скачайте файл и запустите двойным кликом — устанавливать ничего не нужно.
