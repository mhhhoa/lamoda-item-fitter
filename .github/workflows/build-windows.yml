name: Тесты и сборка exe

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Системные библиотеки для Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Прогон тестов
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  windows:
    name: Сборка exe
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Появятся, когда в настройках репозитория заведут сертификат.
      # Без них шаг подписи просто пропускается, сборка идёт как обычно.
      CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Сборка
        run: pyinstaller --noconfirm --clean LamodaItemFitter.spec
      - name: Подпись exe (если заведён сертификат)
        # Единственное, что убирает предупреждение SmartScreen у коллег.
        # Сертификат кладётся в секреты репозитория как base64 от .pfx.
        if: env.CERT_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            dist\LamodaItemFitter\LamodaItemFitter.exe
          Remove-Item cert.pfx -Force
          & $signtool.FullName verify /pa dist\LamodaItemFitter\LamodaItemFitter.exe

      - name: Самопроверка собранного exe
        shell: pwsh
        run: |
          # exe собран без консоли и отпускает командную строку сразу,
          # поэтому ждём процесс явно и читаем его отчёт. Самопроверка сама
          # прогоняет пачку через изолированные процессы — так же, как это
          # делает реальная обработка, и здесь же ловится, если рабочие
          # процессы почему-то не поднимаются в собранном виде
          $process = Start-Process -FilePath dist\LamodaItemFitter\LamodaItemFitter.exe `
            -ArgumentList '--selftest', 'selftest.txt' -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($process.ExitCode -ne 0) {
            Write-Error "самопроверка не прошла (код $($process.ExitCode))"
            exit 1
          }
      - name: Размер сборки
        shell: pwsh
        run: |
          $size = (Get-ChildItem dist\LamodaItemFitter -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("LamodaItemFitter — {0:N1} МБ" -f $size)
      - name: Папка к раздаче
        # Раскладывает подсказки «что запускать» и оборачивает сборку папкой,
        # чтобы архив не высыпался в «Загрузки» россыпью файлов.
        run: python tools/prepare_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: LamodaItemFitter-windows
          path: package/
          if-no-files-found: error
      - name: Черновик релиза
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath LamodaItemFitter-windows.zip
      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: LamodaItemFitter-windows.zip
          body: |
            Программа для Windows — устанавливать ничего не нужно.

            Скачайте `LamodaItemFitter-windows.zip` и распакуйте. Внутри будет
            папка `LamodaItemFitter`, а в ней — файл `LamodaItemFitter.exe`.
            Его и надо запускать двойным кликом; рядом лежит памятка
            «!! КАК ЗАПУСТИТЬ.txt».

            Служебную папку `_internal` открывать не нужно — там библиотеки,
            без которых программа не запустится. Переносить и копировать
            сборку можно только целиком, вместе с `_internal`; один вынутый
            `exe` не работает. Чтобы запускать в один клик, сделайте на
            `LamodaItemFitter.exe` ярлык на рабочем столе.

            **Если Windows показала «Система Windows защитила ваш компьютер»** —
            так она встречает любую программу без цифровой подписи. Чтобы окно
            больше не появлялось, снимите блокировку до распаковки:
            правый клик по скачанному `LamodaItemFitter-windows.zip` →
            **Свойства** → внизу галочка **«Разблокировать»** → **ОК**, и
            только потом распакуйте. Если уже распаковали — то же самое
            можно сделать с файлом `LamodaItemFitter.exe` внутри папки.

  package:
    name: Проверка архива
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LamodaItemFitter-windows
          path: distributed
      - name: Что увидит человек, распаковав архив
        # Сквозная проверка того, что скачивает коллега. Правило, по которому
        # GitHub кладёт файлы в корень архива, менялось от версии к версии,
        # и цена ошибки здесь — не красный тест, а человек, который не может
        # найти, что запускать. Поэтому смотрим на распакованное, а не на
        # то, что мы положили в папку сборки.
        run: |
          set -eu
          find distributed -maxdepth 2 -mindepth 1 | sort
          test -f "distributed/!! КАК ЗАПУСТИТЬ.txt"
          test -f "distributed/LamodaItemFitter/LamodaItemFitter.exe"
          test -f "distributed/LamodaItemFitter/!! КАК ЗАПУСТИТЬ.txt"
          test -f "distributed/LamodaItemFitter/_internal/!! ЗДЕСЬ НИЧЕГО ЗАПУСКАТЬ НЕ НУЖНО.txt"
          test "$(ls -A distributed | wc -l)" -eq 2
