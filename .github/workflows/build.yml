name: Сборка и тесты

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки для Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q

  build-windows:
    name: Сборка exe для Windows
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка
        run: pyinstaller --noconfirm --clean build.spec

      - name: Проверка, что exe получился
        shell: pwsh
        run: |
          $exe = "dist/LamodaItemFitter.exe"
          if (-not (Test-Path $exe)) { throw "exe не собрался" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "LamodaItemFitter.exe — $mb МБ"

      - uses: actions/upload-artifact@v4
        with:
          name: LamodaItemFitter-windows
          path: dist/LamodaItemFitter.exe
          if-no-files-found: error
          retention-days: 90
