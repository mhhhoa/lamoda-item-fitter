# Быстрый пресет: без нейросетевого матирования.
# Годится для тёмного и цветного товара на чистой циклораме. Для белого товара
# и лайфстайла с реквизитом используйте lamoda.yaml.
#
# ВАЖНО: точные числа спецификации проверьте в своём кабинете партнёра
# (academy.lamoda.ru, раздел «Требования к оформлению фотографий» для вашей
# категории). Значения ниже — разумные стартовые, а не выписка из регламента.
# Правятся прямо здесь, без изменения кода.

matting: simple         # без нейросети: быстро и офлайн, но не возьмёт белый товар и реквизит
refine_alpha: true

background:
  poly_degree: 2        # 2 — обычная циклорама, 3 — сложный градиент/виньетка
  target_bg: "#FFFFFF"  # если категория требует светло-серый, ставьте, например, "#EFEFEF"
  knee_low: 0.955
  knee_high: 0.992

look:
  wb_strength: 0.25         # доля отражённого от циклорамы света; подбирается `fitter calibrate`
  reflection_strength: 1.0  # 1.0 — отражение как в оригинале, 0.0 — убрать

output:
  jpeg_quality: 95
  max_bytes: 10485760       # 10 МБ
  geometry_mode: keep       # keep | fit | cover
  out_width: 1500
  out_height: 2000

qa:
  min_white: 250
  max_product_delta_e: 3.0
  max_bg_residual: 0.030
  max_blown_ratio: 0.020
